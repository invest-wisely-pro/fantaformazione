<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantaformazione</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e7b47">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --bg:#e6ece7;--surface:#f6f9f6;--surface2:#edf2ee;--ink:#13201a;--muted:#55665c;--line:#c8d4cb;
  --pitch-a:#2e7b47;--pitch-b:#297141;--chalk:rgba(255,255,255,.5);
  --P:#e0960f;--D:#1f8f55;--C:#2a74c4;--A:#cf3c36;
  --ok:#1c9651;--warn:#d6970c;--bad:#cf3c36;
  --btn:#13201a;--btn-ink:#f6f9f6;--chipbg:#ffffff;--chipink:#13201a;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1510;--surface:#16201a;--surface2:#1c2821;--ink:#e4ede6;--muted:#93a499;--line:#2a3a30;
  --pitch-a:#1f5a34;--pitch-b:#1b522f;--chalk:rgba(255,255,255,.35);
  --P:#f0a92a;--D:#38b070;--C:#4b91de;--A:#e8574f;
  --ok:#37b26b;--warn:#e7ab2a;--bad:#e8574f;
  --btn:#e4ede6;--btn-ink:#0d1510;--chipbg:#f3f6f3;--chipink:#13201a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1510;--surface:#16201a;--surface2:#1c2821;--ink:#e4ede6;--muted:#93a499;--line:#2a3a30;
  --pitch-a:#1f5a34;--pitch-b:#1b522f;--chalk:rgba(255,255,255,.35);
  --P:#f0a92a;--D:#38b070;--C:#4b91de;--A:#e8574f;
  --ok:#37b26b;--warn:#e7ab2a;--bad:#e8574f;
  --btn:#e4ede6;--btn-ink:#0d1510;--chipbg:#f3f6f3;--chipink:#13201a;
  color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Segoe UI",system-ui,sans-serif;min-height:100%;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;letter-spacing:.01em}
h2{font-size:1.5rem;font-weight:700;margin:0 0 .5rem}
h3{font-size:1.15rem;font-weight:600;margin:1.25rem 0 .4rem}
p{margin:.3rem 0 .8rem}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--C);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:8px}
header.top h1{font-size:1.35rem;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .g{font-family:"Barlow Condensed",sans-serif;font-size:1.05rem;color:var(--muted);white-space:nowrap}
main{padding:16px 0 24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{stroke:var(--ink)}

/* Scoreboard + pitch */
.board{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.board .mod{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:4.2rem;line-height:.85;letter-spacing:-.01em}
.board .meta{text-align:right;color:var(--muted);font-size:.92rem;line-height:1.3}
.board .meta b{display:block;color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;line-height:1}
.pitch{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:68/88;max-height:72vh;margin:0 auto;
  background:repeating-linear-gradient(180deg,var(--pitch-a) 0 9.09%,var(--pitch-b) 9.09% 18.18%)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.rows{position:absolute;inset:3% 2% 2%;display:flex;flex-direction:column;justify-content:space-around}
.row{display:flex;justify-content:space-evenly;align-items:flex-start}
.chip{background:none;border:0;padding:2px;display:flex;flex-direction:column;align-items:center;width:19%;min-width:0;cursor:pointer;color:#fff}
.disc{position:relative;width:46px;height:46px;border-radius:50%;background:var(--chipbg);color:var(--chipink);display:grid;place-items:center;border:4px solid var(--role);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.disc b{font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;font-weight:700}
.dot{position:absolute;right:-5px;top:-5px;width:15px;height:15px;border-radius:50%;border:2px solid #fff}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.chip .nm{margin-top:4px;font-weight:600;font-size:.82rem;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.chip .vs{font-size:.72rem;opacity:.9;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.r-P{--role:var(--P)}.r-D{--role:var(--D)}.r-C{--role:var(--C)}.r-A{--role:var(--A)}
.chip.lock .disc::after{content:"";position:absolute;left:-6px;bottom:-4px;width:13px;height:13px;border-radius:3px;background:var(--ink);border:2px solid #fff}

.seg{max-width:100%;overflow-x:auto}
.mods{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.mods button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;text-align:left;cursor:pointer}
.mods button .m{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;line-height:1.1}
.mods button .s{font-size:.8rem;color:var(--muted)}
.mods button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.mods button[aria-pressed="true"] .s{color:inherit;opacity:.75}
.mods button:disabled{opacity:.45;cursor:default}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--btn);color:var(--btn-ink)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.small{padding:7px 12px;font-size:.92rem}
.btn.grow{flex:1}

.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list .n{width:1.6em;text-align:right;color:var(--muted);font-family:"Barlow Condensed",sans-serif;font-size:1.05rem}
.tag{flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem;background:var(--role)}
.who{flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.who .a{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .b{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx{flex:0 0 auto;min-width:38px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;border-radius:8px;padding:1px 6px;border:2px solid var(--line)}
.idx.ok{border-color:var(--ok)}.idx.warn{border-color:var(--warn)}.idx.bad{border-color:var(--bad)}.idx.off{color:var(--muted)}
select.st{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px;font-size:.88rem;max-width:122px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.ver{display:inline-block;font-size:.72rem;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px;color:#fff}
.ver.si{background:var(--ok)}.ver.bil{background:var(--warn);color:#1a1a1a}.ver.no{background:var(--muted)}.ver.out{background:var(--bad)}
.why{list-style:none;padding:0;margin:.3rem 0 .6rem}.why li{padding:3px 0 3px 22px;position:relative;font-size:.92rem}
.why li::before{position:absolute;left:2px;font-weight:700}.why li.p::before{content:'+';color:var(--ok)}.why li.m::before{content:'−';color:var(--bad)}
.auto{font-size:.72rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:1px}
details.guide{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);margin:10px 0}
details.guide summary{cursor:pointer;font-weight:600}
details.guide ol{padding-left:1.3em;margin:.6rem 0}
details.guide li{margin:.45rem 0}
.fresh{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.note{background:var(--surface2);border-left:4px solid var(--warn);border-radius:6px;padding:10px 12px;margin:10px 0;font-size:.94rem}
.empty{text-align:center;padding:32px 8px}
.empty .big{font-family:"Barlow Condensed",sans-serif;font-size:2.2rem;font-weight:700;line-height:1.05;margin-bottom:8px}

.field{display:block;margin:10px 0}
.field > span{display:block;font-size:.88rem;color:var(--muted);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px}
.field textarea{min-height:150px;font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.fx{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.fx .t{flex:1;font-weight:600;min-width:0}
.fx select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px;max-width:42%}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;cursor:pointer}
.stepper output{font-family:"Barlow Condensed",sans-serif;font-size:2rem;font-weight:700;min-width:2.2ch;text-align:center}
.votes input{width:64px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px;text-align:center}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface);font-family:"Barlow Condensed",sans-serif;font-size:1.1rem;font-weight:600}
.range{display:grid;grid-template-columns:8.5em 1fr 3em;align-items:center;gap:10px;margin:6px 0}
.range output{text-align:right;font-weight:600}
.tablewrap{overflow-x:auto}
table.teams{border-collapse:collapse;width:100%;font-size:.94rem}
table.teams th,table.teams td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.teams th{font-weight:600;color:var(--muted)}
table.teams input{width:56px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px;text-align:center}

dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:88vh;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,12,8,.55)}
.dlg{padding:18px 18px 16px;overflow-y:auto;max-height:88vh}
.dlg .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dlg .head h2{margin:0;flex:1;min-width:0}
.x{border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.bar{margin:12px 0}
.bar .l{display:flex;justify-content:space-between;font-weight:600}
.bar .track{height:8px;border-radius:4px;background:var(--surface2);margin:4px 0 3px;overflow:hidden}
.bar .fill{height:100%;background:var(--ink);border-radius:4px}
.bar .d{font-size:.86rem;color:var(--muted)}
.bigidx{font-family:"Barlow Condensed",sans-serif;font-size:3rem;font-weight:700;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (min-width:640px){.board .mod{font-size:5rem}.disc{width:54px;height:54px}.chip .nm{font-size:.9rem}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1 id="tName">Fantaformazione</h1><span class="g" id="tG"></span></div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabs" aria-label="Sezioni"><div class="wrap">
  <a href="#formazione" data-tab="formazione"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M4 12h16"/><circle cx="12" cy="12" r="2.6"/></svg>Formazione</a>
  <a href="#rosa" data-tab="rosa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.4 6-5.4s5.4 2 6 5.4"/><path d="M16 4.8a3.2 3.2 0 0 1 0 6.4M18 14.8c1.7.7 2.7 2.4 3 5.2"/></svg>Rosa</a>
  <a href="#giornata" data-tab="giornata"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Giornata</a>
  <a href="#mercato" data-tab="mercato"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/><path d="M15 7h3v3"/></svg>Mercato</a>
  <a href="#lega" data-tab="lega"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="1.8" fill="var(--surface)"/><circle cx="15" cy="12" r="1.8" fill="var(--surface)"/><circle cx="8" cy="17" r="1.8" fill="var(--surface)"/></svg>Lega</a>
</div></nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<input type="file" id="fileX" accept=".xlsx,.xls,.csv" multiple hidden>
<input type="file" id="fileB" accept=".json,application/json" hidden>

<script>
/* ---------- Costanti ---------- */
const MODULI_ALL=['3-4-3','3-5-2','4-3-3','4-4-2','4-5-1','5-3-2','5-4-1'];
const RUOLI={P:'Portiere',D:'Difensore',C:'Centrocampista',A:'Attaccante'};
const ORD=['P','D','C','A'];
const STATI={tit:{l:'Titolare',s:100},bal:{l:'Ballottaggio',s:60},dub:{l:'In dubbio',s:35},pan:{l:'Panchina',s:15},inf:{l:'Infortunato',s:0,out:true},squ:{l:'Squalificato',s:0,out:true}};
const TEAMS0=[['Inter',21,9],['Lazio',14,4],['Roma',16,3],['Milan',14,7],['Como',12,7],['Frosinone',13,9],['Cagliari',6,7],['Juventus',9,8],['Napoli',10,7],['Torino',10,9],['Atalanta',10,11],['Lecce',9,12],['Sassuolo',12,14],['Monza',13,15],['Bologna',6,10],['Udinese',9,16],['Genoa',5,13],['Fiorentina',8,17],['Parma',4,13],['Venezia',6,16]];
const CAL={
 8:[['Torino','Monza'],['Cagliari','Bologna'],['Como','Sassuolo'],['Napoli','Roma'],['Lazio','Parma'],['Inter','Fiorentina'],['Genoa','Venezia'],['Atalanta','Frosinone'],['Lecce','Juventus'],['Udinese','Milan']],
 9:[['Sassuolo','Lazio'],['Roma','Cagliari'],['Torino','Como'],['Parma','Udinese'],['Milan','Bologna'],['Venezia','Inter'],['Monza','Napoli'],['Genoa','Juventus'],['Frosinone','Lecce'],['Fiorentina','Atalanta']]
};

/* ---------- Utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TRASL={'ø':'o','Ø':'o','æ':'ae','Æ':'ae','œ':'oe','ß':'ss','ł':'l','Ł':'l','đ':'d','Đ':'d','ı':'i','þ':'th'};
const norm=s=>String(s||'').replace(/[øØæÆœßłŁđĐıþ]/g,c=>TRASL[c]).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const uid=()=>Math.random().toString(36).slice(2,10);
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const abbr=t=>({Inter:'INT',Juventus:'JUV',Genoa:'GEN',Fiorentina:'FIO',Frosinone:'FRO',Monza:'MON',Milan:'MIL'}[t]||String(t||'').slice(0,3).toUpperCase());
const f2=n=>n==null?'–':n.toFixed(2).replace('.',',');
const f1=n=>n==null?'–':n.toFixed(1).replace('.',',');
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}

/* ---------- Archivio locale (IndexedDB) ---------- */
const DB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('fantaformazione',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
 get(k){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})},
 set(k,v){return new Promise(res=>{if(!this.db)return res(false);try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}
};
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{DB.set('state',JSON.parse(JSON.stringify(S)))},250)}

function fixturesFromCal(g){const m={};(CAL[g]||[]).forEach(([h,a])=>{m[h]={opp:a,casa:true};m[a]={opp:h,casa:false}});return m}
function defState(){return{v:1,
 settings:{nome:'La mia squadra',giornata:8,giornataAuto:true,moduli:[...MODULI_ALL],panchina:7,imbattuto:false,sostituzioni:true},
 teams:TEAMS0.map(([n,gf,gs])=>({n,g:7,gf,gs})),teamsAgg:'19 ottobre 2026, dopo 7 giornate',
 players:[],fixtures:{},listone:[],listoneInfo:null,demo:false,
 votiUff:{},votiUffInfo:{},
 mb:{squadre:10,crediti:500,orizzonte:'stagione',ruolo:'tutti',sez:'valori',residui:null,daComprare:3},lega:[]}}
let S=defState();
const ui={modulo:null};

/* ---------- Dati automatici (dati.json, aggiornato da GitHub) ---------- */
let DATI=null,GI=new Map();const FXC={};
function fmtData(iso){try{const d=new Date(iso);return d.toLocaleDateString('it-IT',{day:'numeric',month:'long'})+' alle '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}catch(e){return iso}}
async function loadDati(rete=true){

 let nuovo=false;

function applyDati(){

 if(DATI.squadre&&DATI.squadre.length){S.teams=DATI.squadre.map(t=>Object.assign({},t));S.teamsAgg=DATI.aggiornato?'aggiornati in automatico il '+fmtData(DATI.aggiornato):'dati iniziali'}

function apiOf(p){return p.apiId!=null?GI.get(p.apiId):null}
function ruoloUff(g){const L=typeof listoneDi==='function'?listoneDi(g):null;return L&&L.r?L.r:g.r}
function autoLink(){
 if(!GI.size)return;
 for(const p of S.players){if(p.apiId!=null&&GI.has(p.apiId))continue;const g=trovaApi(p.nome,p.squadra,p.ruolo);p.apiId=g?g.id:null}
}
function trovaApi(nome,squadra,ruolo){
 const n=norm(nome);if(!n)return null;const toks=n.split(' ');const last=toks[toks.length-1];
 const pool=[...GI.values()].filter(g=>!squadra||norm(g.s)===norm(squadra));
 const sc=g=>{const a=norm(g.n),c=norm(g.c);if(a===n||c===n)return 3;const ct=c.split(' ').concat(a.split(' '));if(toks.every(t=>ct.includes(t)))return 2;if(ct.includes(last)&&last.length>2)return 1;if(toks.some(t=>t.length>2&&ct.includes(t)))return 1;return 0};
 let best=[];let bs=0;for(const g of pool){const v=sc(g);if(v>bs){bs=v;best=[g]}else if(v===bs&&v>0)best.push(g)}
 if(best.length>1&&ruolo)best=best.filter(g=>g.r===ruolo);
 return bs>0&&best.length===1?best[0]:null;
}
function fxFromDati(g){if(FXC[g])return FXC[g];const m={};const L=DATI&&DATI.calendario&&DATI.calendario[g];if(!L)return null;L.forEach(([h,a])=>{m[h]={opp:a,casa:true};m[a]={opp:h,casa:false}});return FXC[g]=m}
function fxBase(g){return fxFromDati(g)||fixturesFromCal(g)}
function statoEff(p,g){
 if(p.statoG===g)return{s:p.stato,auto:false};
 if((p.stato==='inf'||p.stato==='squ')&&p.statoG!=null&&g>p.statoG){
  if(p.statoFino!=null){if(g<=p.statoFino)return{s:p.stato,auto:false,lungo:true}}
  else if(!histOf(p).some(h=>h.g>p.statoG&&h.min>0))return{s:p.stato,auto:false,lungo:true};
 }
 const ind=p.apiId!=null&&DATI&&DATI.indisponibili&&DATI.indisponibili[p.apiId];
 if(ind&&g===DATI.giornataCorrente)return{s:ind.t,auto:true,m:ind.m};
 if(p.apiId!=null&&DATI)return{s:'tit',auto:true};
 return{s:p.stato||'tit',auto:false};
}
function histOf(p){
 const m=new Map();
 if(p.apiId!=null&&DATI&&DATI.voti){for(const [g,vs] of Object.entries(DATI.voti)){const v=vs[p.apiId];if(v)m.set(+g,{g:+g,fv:v[0],min:v[1],casa:v[2]==null?null:!!v[2],start:v.length>5?!!v[5]:null,xg:v.length>6?v[6]:null,xa:v.length>7?v[7]:null,auto:true})}}
 if(p.apiId!=null&&S.votiUff){for(const g in S.votiUff){const v=S.votiUff[g][p.apiId];if(v){const e=m.get(+g)||{g:+g,min:null,casa:null};m.set(+g,Object.assign({},e,{fv:v[0],voto:v[1],uff:true,min:e.min!=null?e.min:(v[0]!=null?90:0)}))}}}
 (p.hist||[]).forEach(h=>m.set(h.g,h));return[...m.values()];
}

/* ---------- Algoritmo: punti attesi ---------- */
const STATO_P={tit:.9,bal:.5,dub:.3,pan:.1,inf:0,squ:0};
const PRIOR={P:{fm:5.0,g:0,a:.005},D:{fm:5.9,g:.04,a:.05},C:{fm:6.1,g:.09,a:.10},A:{fm:6.6,g:.30,a:.11}};
const RISERVA=5.5; // fantavoto tipico di un panchinaro che entra al posto di chi non gioca
const PESI_RECENTI=[.32,.24,.18,.14,.12];
function rate(o){if(!o||!o.g)return null;const x=o.xgf!=null&&o.xgs!=null;return{att:(x?(o.gf+o.xgf)/2:o.gf)/o.g,dif:(x?(o.gs+o.xgs)/2:o.gs)/o.g,g:o.g}}
function findTeam(n){return S.teams.find(x=>norm(x.n)===norm(n))}
function leagueAvg(){const r=S.teams.map(rate).filter(Boolean);return r.length?avg(r.map(x=>x.att)):1.3}
// forza offensiva e difensiva per questa partita: stagione, casa o trasferta, ultime 6
function teamRate(n,casa){
 const t=findTeam(n);const all=rate(t);if(!all)return null;
 let att=all.att,dif=all.dif;const sp=rate(t[casa?'casa':'fuori']);
 if(sp){const w=sp.g/(sp.g+4);att=w*sp.att+(1-w)*all.att;dif=w*sp.dif+(1-w)*all.dif}
 else{const h=casa?1.1:.9;att*=h;dif*=2-h}
 const fo=rate(t.forma);let fa=1,fd=1;
 if(fo&&fo.g>=3&&fo.g<all.g){const w=fo.g/(fo.g+6);fa=1+w*(fo.att/all.att-1);fd=1+w*(fo.dif/all.dif-1);att*=fa;dif*=fd}
 return{att,dif,all,fa,fd};
}
function teamStats(n){const t=findTeam(n);const r=rate(t);return r?{gf:t.gf/t.g,gs:t.gs/t.g,af:r.att,as:r.dif}:null}
function fixtureOf(p,g){const o=(S.fixtures[g]||{})[p.squadra];if(o&&o.opp)return o;return (fxBase(g)||{})[p.squadra]||null}
function poisson(l,k){let f=1;for(let i=2;i<=k;i++)f*=i;return Math.exp(-l)*Math.pow(l,k)/f}
function esiti(lf,la){let w=0,d=0;for(let i=0;i<9;i++)for(let j=0;j<9;j++){const pr=poisson(lf,i)*poisson(la,j);if(i>j)w+=pr;else if(i===j)d+=pr}return{w,d,l:Math.max(0,1-w-d)}}
function lambdas(team,fx){
 if(!fx||!fx.opp)return null;const T=teamRate(team,fx.casa),O=teamRate(fx.opp,!fx.casa);if(!T||!O)return null;
 const mu=leagueAvg()||1.3;
 return{lf:T.att*O.dif/mu,la:O.att*T.dif/mu,mf:T.all.att,ma:T.all.dif,T,O};
}
function dataPartita(team,g){const L=DATI&&DATI.calendario&&DATI.calendario[g];const m=L&&L.find(x=>x[0]===team||x[1]===team);return m&&m[4]?new Date(m[4]):null}
// presenze nelle ultime 5 partite giocate dalla sua squadra (anche quelle saltate)
function partecipazione(p,g){
 const h=histOf(p);const byG=new Map(h.map(x=>[x.g,x]));
 const mk=x=>x?{g:x.g,min:x.min||0,start:x.start!=null?x.start:(x.min||0)>=45,xg:x.xg,xa:x.xa}:null;
 if(p.apiId!=null&&DATI&&DATI.calendario){
  const gs=Object.entries(DATI.calendario).filter(([gg,L])=>+gg<g&&L.some(m=>(m[0]===p.squadra||m[1]===p.squadra)&&m[2]!=null)).map(([gg])=>+gg).sort((x,y)=>y-x).slice(0,5);
  if(gs.length)return gs.map(gg=>mk(byG.get(gg))||{g:gg,min:0,start:false,xg:null,xa:null});
 }
 const L=h.filter(x=>x.min!=null&&x.g<g).sort((x,y)=>y.g-x.g).slice(0,5).map(mk);
 return L.length?L:null;
}
function pesato(part,f){let w=0,t=0;part.forEach((x,i)=>{const k=PESI_RECENTI[i]||.1;w+=k;t+=k*f(x)});return w?t/w:0}
function probGioca(p,se,part,g){
 const st=STATI[se.s]||STATI.tit;const info={};
 if(st.out)return{v:0,d:st.l+(se.m?`: ${se.m}`:se.lungo?(p.statoFino?`, fino alla giornata ${p.statoFino}`:', finché non torna a giocare'):''),info};
 if(p.forza==='out')return{v:0,d:'Escluso da te',info};
 let v=STATO_P[se.s]??.9,d=st.l+(se.m?`: ${se.m}`:'');info.stato=se.s;info.m=se.m;info.auto=se.auto;
 if(part&&part.length){
  const n=part.length,tit=part.filter(x=>x.start&&x.min>0).length,ent=part.filter(x=>!x.start&&x.min>0).length;
  Object.assign(info,{n,tit,ent});
  const ps=pesato(part,x=>x.start&&x.min>0?1:0),pe=pesato(part,x=>!x.start&&x.min>0?1:0);
  const txt=`nelle ultime ${n} della sua squadra: ${tit} da titolare${ent?`, ${ent} dalla panchina`:''}`;
  if(se.auto&&se.s==='tit'){v=.03+.94*ps+.45*pe;d=txt.charAt(0).toUpperCase()+txt.slice(1)}else d+=`; ${txt}`;
  // turno ravvicinato: chi ha giocato da titolare pochi giorni prima rischia il riposo
  const prev=part[0];const dn=dataPartita(p.squadra,g),dp=prev&&dataPartita(p.squadra,prev.g);
  if(dn&&dp&&prev.start&&prev.min>=60){const gg=(dn-dp)/864e5;if(gg>0&&gg<=3.6){v-=.06;info.riposo=Math.round(gg);d+=`; ha giocato ${Math.round(gg)} giorni prima`}}
 }
 return{v:clamp(v,0,.97),d,info};
}
function fvAtteso(p,fx,part){
 const pr=PRIOR[p.ruolo]||PRIOR.C;const voti=histOf(p).filter(h=>h.fv!=null).sort((x,y)=>y.g-x.g);
 const api=apiOf(p),ufficiale=p.fm!=null,stimata=!ufficiale&&api&&api.fm!=null;
 const season=ufficiale?p.fm:stimata?api.fm:(voti.length?avg(voti.map(h=>h.fv)):null);
 const nv=ufficiale?(p.pv||Math.max(voti.length,5)):voti.length;
 const trend=voti.length>=2?avg(voti.slice(0,5).map(h=>h.fv)):null;
 let venue=null;if(fx){const vv=voti.filter(h=>h.casa===fx.casa);if(vv.length>=3)venue=avg(vv.map(h=>h.fv))}
 const parts=[[season,.55],[trend,.3],[venue,.15]].filter(x=>x[0]!=null);
 let base=pr.fm,dBase=`Nessun voto: parte dalla media del ruolo (${f2(pr.fm)})`;
 if(parts.length){
  const w=parts.reduce((t,x)=>t+x[1],0),raw=parts.reduce((t,x)=>t+x[0]*x[1],0)/w;
  base=(raw*nv+pr.fm*3)/(nv+3);
  dBase=`Fantamedia ${f2(season)}${stimata?' stimata':''}${trend!=null?`, ultime ${Math.min(5,voti.length)}: ${f2(trend)}`:''}${venue!=null?`, ${fx.casa?'in casa':'in trasferta'}: ${f2(venue)}`:''}${nv<5?', pochi voti: avvicinata alla media del ruolo':''}`;
 }
 const info={season,trend,venue,nv};
 const hot=season!=null&&trend!=null&&voti.length>=3?(trend-season>=.5?1:season-trend>=.5?-1:0):0;
 // pericolosità: gol e assist attesi ogni 90′, stagione e ultime partite
 let q={g:pr.g,a:pr.a};
 if(api&&api.min>0){const w=api.min/(api.min+900),n90=api.min/90;
  q={g:w*(((api.gol+(api.xg??api.gol))/2)/n90)+(1-w)*pr.g,a:w*(((api.ass+(api.xa??api.ass))/2)/n90)+(1-w)*pr.a}}
 const rec=(part||[]).filter(x=>x.min>0&&x.xg!=null);const minRec=rec.reduce((t,x)=>t+x.min,0);
 if(minRec>=180){const r90={g:rec.reduce((t,x)=>t+x.xg,0)/(minRec/90),a:rec.reduce((t,x)=>t+(x.xa||0),0)/(minRec/90)};
  info.rec90=r90.g+r90.a;info.sea90=q.g+q.a;q={g:.65*q.g+.35*r90.g,a:.65*q.a+.35*r90.a}}
 const Lp=api?listoneDi(api):null;info.rig=(api&&api.pxg>=.7)||!!(Lp&&(Lp.rc||0)>=1);
 const L=lambdas(p.squadra,fx);let adj=0,dM=fx&&fx.opp?`Contro ${fx.opp}: mancano i dati delle squadre`:'Avversario non impostato (sezione Giornata)';
 if(L){
  const pos=(part||[]).filter(x=>x.min>0);const pm=pos.length?clamp(avg(pos.map(x=>x.min))/90,.4,1):.85;
  const dl=(L.lf-L.mf)*pm/Math.max(.3,L.mf);
  adj=3*q.g*dl+q.a*dl;
  const cs=Math.exp(-L.la),cs0=Math.exp(-L.ma);
  const e=esiti(L.lf,L.la),e0=esiti(L.mf,L.ma);
  adj+=.3*((e.w-e.l)-(e0.w-e0.l)); // chi vince prende voti più alti
  if(p.ruolo==='P'){adj+=-(L.la-L.ma)+.5*(cs-cs0);if(S.settings.imbattuto)adj+=cs}
  if(p.ruolo==='D')adj+=.5*(cs-cs0);
  Object.assign(info,{lf:L.lf,la:L.la,mf:L.mf,ma:L.ma,cs,cs0,vit:e.w,sconf:e.l,formaAtt:L.T.fa,formaDifOpp:L.O.fd});
  dM=`${fx.casa?'In casa':'In trasferta'} contro ${fx.opp}: la sua squadra dovrebbe segnare ${f1(L.lf)} gol e subirne ${f1(L.la)} (di solito ${f1(L.mf)} e ${f1(L.ma)}), vittoria ${Math.round(e.w*100)}%${p.ruolo==='P'||p.ruolo==='D'?`, porta inviolata ${Math.round(cs*100)}%`:''}`;
 }
 return{v:base+adj,base,adj,dBase,dM,hot,season,info};
}
// motivi a favore e contro, dai numeri del calcolo
function motivi(p,P,F){
 const m=[];const add=(s,t)=>m.push({s,t});const I=P.info,J=F.info;const off=p.ruolo==='C'||p.ruolo==='A';
 if(I.stato&&I.stato!=='tit')add(-1,`${STATI[I.stato].l.toLowerCase()}${I.m?`: ${I.m}`:I.auto?'':' (indicato da te)'}`);
 if(I.n){if(I.tit>=Math.max(3,I.n-1))add(1,`titolare in ${I.tit} delle ultime ${I.n}`);else if(I.tit<=Math.floor(I.n/2))add(-1,I.tit?`titolare solo in ${I.tit} delle ultime ${I.n}`:`mai titolare nelle ultime ${I.n}`)}
 if(I.riposo)add(-1,`ha giocato ${I.riposo} giorni prima: rischio turnover`);
 if(F.hot===1)add(1,`in forma: ${f2(J.trend)} di media nelle ultime partite, ${f2(J.season)} in stagione`);
 if(F.hot===-1)add(-1,`in calo: ${f2(J.trend)} di media nelle ultime partite, ${f2(J.season)} in stagione`);
 if(J.rec90!=null&&p.ruolo!=='P'&&J.sea90>.05){const r=J.rec90/J.sea90;if(r>=1.3)add(1,`più pericoloso del solito: ${f2(J.rec90)} gol e assist attesi ogni 90′ nelle ultime partite`);else if(r<=.7)add(-1,`meno pericoloso del solito: ${f2(J.rec90)} gol e assist attesi ogni 90′ nelle ultime partite`)}
 if(J.rig&&p.ruolo!=='P')add(1,'batte i rigori');
 if(J.venue!=null&&J.season!=null){const d=J.venue-J.season;if(Math.abs(d)>=.4)add(d>0?1:-1,`${d>0?'rende di più':'rende di meno'} ${F.dM.startsWith('In casa')?'in casa':'in trasferta'} (${f2(J.venue)})`)}
 if(J.lf!=null){
  const r=J.lf/J.mf;
  if(off||p.ruolo==='D'){if(r>=1.15)add(1,`la sua squadra dovrebbe segnare più del solito (${f1(J.lf)} gol attesi)`);else if(r<=.87)add(-1,`partita difficile in attacco: ${f1(J.lf)} gol attesi per la sua squadra`)}
  if(p.ruolo==='P'||p.ruolo==='D'){if(J.cs>=J.cs0+.07)add(1,`porta inviolata probabile al ${Math.round(J.cs*100)}%`);else if(J.cs<=J.cs0-.07)add(-1,`avversario pericoloso: porta inviolata solo al ${Math.round(J.cs*100)}%`)}
  if(J.vit>=.55)add(1,`squadra favorita: vittoria al ${Math.round(J.vit*100)}%`);else if(J.vit<=.2)add(-1,`squadra sfavorita: vittoria al ${Math.round(J.vit*100)}%`);
  if(J.formaDifOpp>=1.12&&off)add(1,'l’avversario sta subendo più del solito nelle ultime partite');
  if(J.formaAtt<=.88&&off)add(-1,'la sua squadra segna meno del solito nelle ultime partite');
 }
 if(J.nv<3)add(-1,'pochi dati: stima incerta');
 return m;
}
function score(p,g){
 const fx=fixtureOf(p,g),se=statoEff(p,g),part=partecipazione(p,g);
 const P=probGioca(p,se,part,g),F=fvAtteso(p,fx,part);
 const R=S.settings.sostituzioni===false?0:RISERVA;
 const out=P.v===0;
 const pts=out?0:P.v*F.v+(1-P.v)*R;
 const lvl=P.v>=.75?'ok':P.v>=.45?'warn':'bad';
 return{p,P,F,R,pts,vb:out?0:P.v*F.v,out,lvl,fx,st:se.s,auto:se.auto,lungo:se.lungo,mot:out?[]:motivi(p,P,F)};
}
function calcola(){
 const g=S.settings.giornata;const sc=S.players.map(p=>score(p,g));
 const pool={P:[],D:[],C:[],A:[]};
 sc.filter(s=>!s.out).forEach(s=>pool[s.p.ruolo]&&pool[s.p.ruolo].push(s));
 const key=s=>s.pts+(s.p.forza==='in'?1000:0);
 ORD.forEach(r=>pool[r].sort((a,b)=>key(b)-key(a)));
 const mods=(S.settings.moduli.length?S.settings.moduli:MODULI_ALL);
 const ranking=mods.map(m=>{const [d,c,a]=m.split('-').map(Number);const need={P:1,D:d,C:c,A:a};
  const xi={};let sum=0,missing=[];
  ORD.forEach(r=>{xi[r]=pool[r].slice(0,need[r]);sum+=xi[r].reduce((t,x)=>t+x.pts,0);if(xi[r].length<need[r])missing.push(`${need[r]-xi[r].length} ${r}`)});
  const forced=ORD.reduce((n,r)=>n+pool[r].filter(s=>s.p.forza==='in').length-xi[r].filter(s=>s.p.forza==='in').length,0);
  return{modulo:m,xi,sum,ok:!missing.length,missing,forcedOut:forced}});
 const valid=ranking.filter(r=>r.ok);
 const pref=valid.filter(r=>!r.forcedOut);
 const best=(pref.length?pref:valid).slice().sort((a,b)=>b.sum-a.sum)[0]||null;
 ranking.sort((a,b)=>(b.ok-a.ok)||(b.sum-a.sum));
 return{sc,pool,ranking,best};
}
function panchina(res,form){
 const used=new Set(ORD.flatMap(r=>form.xi[r].map(s=>s.p.id)));
 const left={};ORD.forEach(r=>left[r]=res.pool[r].filter(s=>!used.has(s.p.id)).sort((a,b)=>b.vb-a.vb));
 const n=S.settings.panchina;const out=[];
 if(left.P.length&&out.length<n)out.push(left.P.shift());
 let any=true;while(out.length<n&&any){any=false;for(const r of ['D','C','A']){if(out.length>=n)break;if(left[r].length){out.push(left[r].shift());any=true}}}
 if(out.length<n&&left.P.length)out.push(...left.P.splice(0,n-out.length));
 return out.sort((a,b)=>ORD.indexOf(a.p.ruolo)-ORD.indexOf(b.p.ruolo));
}

function verdetti(){
 const res=calcola();const ch=(ui.modulo&&res.ranking.find(r=>r.modulo===ui.modulo&&r.ok))||res.best;const V=new Map();
 if(!ch){res.sc.forEach(s=>V.set(s.p.id,{k:s.out?'out':'pan',t:s.out?'Non disponibile':'Da valutare'}));return V}
 const bench=new Set(panchina(res,ch).map(s=>s.p.id));
 ORD.forEach(r=>{
  const xi=ch.xi[r],ids=new Set(xi.map(s=>s.p.id));const last=xi[xi.length-1];
  const fuori=res.pool[r].filter(s=>!ids.has(s.p.id));const primo=fuori[0];
  res.sc.filter(s=>s.p.ruolo===r).forEach(s=>{
   if(s.out){V.set(s.p.id,{k:'out',t:'Non disponibile'});return}
   if(ids.has(s.p.id)){const marg=primo?s.pts-primo.pts:9;V.set(s.p.id,marg<.15&&s.p.forza!=='in'?{k:'bil',t:'Schieralo, di poco',d:`supera ${primo.p.nome} di ${f2(Math.max(0,marg))} punti`}:{k:'si',t:'Schieralo'});return}
   const marg=last?last.pts-s.pts:9;
   V.set(s.p.id,marg<.15?{k:'bil',t:'In bilico',d:`${f2(marg)} punti sotto ${last.p.nome}`}:{k:'no',t:bench.has(s.p.id)?'In panchina':'Tribuna',d:last?`${f2(marg)} punti sotto ${last.p.nome}, l’ultimo ${RUOLI[r].toLowerCase()} schierato`:''});
  });
 });
 return V;
}

function vFormazione(){
 if(!S.players.length)return emptyRosa();
 const res=calcola();
 const chosen=(ui.modulo&&res.ranking.find(r=>r.modulo===ui.modulo&&r.ok))||res.best;
 if(!chosen){const r0=res.ranking[0];return`<div class="empty"><div class="big">Rosa incompleta per i moduli scelti</div><p class="muted">Per il modulo ${esc(r0.modulo)} mancano ${esc(r0.missing.join(', '))} disponibili. Aggiungi giocatori o controlla gli indisponibili.</p><div class="actions" style="justify-content:center"><a class="btn" href="#rosa">Vai alla rosa</a></div></div>`}
 const bench=panchina(res,chosen);
 const xiAll=ORD.flatMap(r=>chosen.xi[r]);
 const totPts=chosen.sum;
 const risk=xiAll.filter(s=>s.lvl==='bad').length;
 const noFx=xiAll.filter(s=>!s.fx||!s.fx.opp).length;
 const off=res.sc.filter(s=>s.out);
 const rowsHTML=['A','C','D','P'].map(r=>`<div class="row">${chosen.xi[r].map(chip).join('')}</div>`).join('');
 const isBest=chosen===res.best;
 return`${S.demo?`<div class="note">Stai usando la rosa di esempio, con nomi e voti inventati. Quando hai inserito la tua, cancellala da Lega.</div>`:''}
 <div class="board"><div><div class="muted small">${isBest?'Modulo consigliato':'Modulo scelto da te'}</div><div class="mod">${chosen.modulo}</div></div>
 <div class="meta"><b>${f1(totPts)}</b>punti attesi<br>${risk?`${risk} a rischio`:'nessuno a rischio'}</div></div>
 <div class="pitch">${pitchSVG()}<div class="rows">${rowsHTML}</div></div>
 <div class="mods" role="group" aria-label="Moduli">${res.ranking.map(r=>`<button data-act="mod" data-m="${r.modulo}" aria-pressed="${r===chosen}" ${r.ok?'':'disabled'}><span class="m">${r.modulo}</span><span class="s">${r.ok?(r===res.best?'migliore, ':'')+f1(r.sum)+' punti':'mancano '+esc(r.missing.join(', '))}</span></button>`).join('')}</div>
 ${noFx?`<p class="small muted">${noFx} titolari senza avversario impostato: la difficoltà della partita per loro vale neutra. Impostala in Giornata.</p>`:''}
 <div class="actions"><button class="btn grow" data-act="copy">Copia formazione</button>${navigator.share?'<button class="btn sec" data-act="share">Condividi</button>':''}</div>
 <h3>Panchina, in ordine di entrata</h3>
 <ul class="list">${bench.map((s,i)=>row(s,i+1)).join('')||'<li class="muted">Nessun giocatore disponibile per la panchina.</li>'}</ul>
 ${off.length?`<h3>Non disponibili</h3><ul class="list">${off.map(s=>row(s)).join('')}</ul>`:''}
 ${DATI&&DATI.aggiornato?`<p class="fresh">Dati di Serie A aggiornati il ${fmtData(DATI.aggiornato)}.</p>`:''}
 <p class="small muted" style="margin-top:14px">Il numero su ogni giocatore sono i fantapunti che ci si può aspettare da lui. Il pallino dice quanto è probabile che giochi: verde 75% o più, giallo dal 45%, rosso sotto. Tocca un giocatore per vedere il calcolo.</p>`;
}

function findListone(nome){const n=norm(nome);return S.listone.find(x=>norm(x.nome)===n)}
function ruoloDaListone(p){
 const g=apiOf(p);let L=g?listoneDi(g):null;
 if(!L){const c=S.listone.filter(x=>norm(x.nome)===norm(p.nome));L=c.length===1?c[0]:c.find(x=>norm(x.squadra)===norm(p.squadra))||null}
 return L&&L.r?L.r:null;
}
function allineaRuoli(){let n=0;S.players.forEach(p=>{if(p.ruoloManuale)return;const r=ruoloDaListone(p);if(r&&r!==p.ruolo){p.ruolo=r;n++}});return n}
function applyListoneTo(p){
 let L=S.listone.filter(x=>norm(x.nome)===norm(p.nome));
 if(L.length>1)L=L.filter(x=>norm(x.squadra)===norm(p.squadra));
 if(L.length===1){const x=L[0];if(x.fm!=null)p.fm=x.fm;if(x.pv!=null)p.pv=x.pv;if(x.mv!=null)p.mv=x.mv;return true}return false;
}
async function copyText(t){
 try{await navigator.clipboard.writeText(t);return true}catch(e){}
 try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}
}

function leggiVoti(rows,nomeFile){
 // file "Voti_Fantacalcio_Stagione_..._Giornata_N": per ogni squadra il nome, poi l'intestazione "Cod."
 let g=null;const m=String(nomeFile).match(/giornata[^0-9]{0,3}(\d{1,2})/i);if(m)g=+m[1];
 if(!g){for(const r of rows.slice(0,4)){const t=r.join(' ');const k=t.match(/giornata[^0-9]{0,3}(\d{1,2})/i)||t.match(/(\d{1,2})\s*[ªa°]\s*giornata/i);if(k){g=+k[1];break}}}
 if(!g){const x=prompt(`Di quale giornata sono i voti di ${nomeFile}?`);g=num(x);if(!g)return null}
 let H=null,team=null;const out={},nonTrovati=[];let n=0;
 const ix=k=>H.indexOf(k);
 for(let i=0;i<rows.length;i++){const r=rows[i];const c0=String(r[0]??'').trim();
  if(norm(c0)==='cod'){H=r.map(c=>norm(c));team=String((rows[i-1]||[])[0]??'').trim();const t=S.teams.find(t=>norm(t.n)===norm(team)||norm(team).startsWith(norm(t.n)));team=t?t.n:team;continue}
  if(!H||c0===''||isNaN(+c0))continue;
  const ruolo=String(r[ix('ruolo')]??'').trim().toUpperCase();if(ruolo==='ALL'||!'PDCA'.includes(ruolo.charAt(0)))continue;
  const nome=String(r[ix('nome')]??'').trim();const vs=String(r[ix('voto')]??'').replace(',','.').replace('*','').trim();
  const voto=/^\d+(\.\d+)?$/.test(vs)?+vs:null;const val=k=>{const j=ix(k);return j>=0?(num(r[j])||0):0};
  const fv=voto==null?null:Math.round((voto+3*val('gf')+3*val('rf')-val('gs')+3*val('rp')-3*val('rs')-2*val('au')-.5*val('amm')-val('esp')+val('ass'))*10)/10;
  const gi=trovaApi(nome,team,ruolo.charAt(0));n++;
  if(gi)out[gi.id]=[fv,voto];else nonTrovati.push(`${nome} (${team})`);
 }
 return{g,out,n,nonTrovati};
}
function leggiListone(rows,nomeFile){
 const hi=rows.findIndex(r=>r.some(c=>norm(c)==='nome')&&r.some(c=>['r','ruolo'].includes(norm(c))));if(hi<0)return null;
 const H=rows[hi].map(c=>norm(c));const col=(...k)=>{for(const x of k){const i=H.indexOf(x);if(i>=0)return i}return -1};
 const iR=col('r','ruolo'),iN=col('nome'),iS=col('squadra'),iQt=col('qt a','qta','quotazione','qt'),iFvm=col('fvm');
 const extra={pv:col('pv'),mv:col('mv'),fm:col('fm'),gf:col('gf'),gs:col('gs'),rp:col('rp'),rc:col('rc'),rseg:col('r'),rsb:col('r 1'),ass:col('ass'),amm:col('amm'),esp:col('esp'),au:col('au')};
 // nel file statistiche le colonne dei rigori sono "R+" e "R-": norm le rende "r" e "r"; le cerchiamo dopo "rc"
 const iRc=extra.rc;const iRp=iRc>=0?iRc+1:-1,iRm=iRc>=0?iRc+2:-1;
 const tipo=iQt>=0||iFvm>=0?'quotazioni':extra.fm>=0?'statistiche':'listone';
 const list=[];
 for(const r of rows.slice(hi+1)){const nome=String(r[iN]??'').trim();const ru=String(r[iR]??'').trim().toUpperCase().charAt(0);
  if(!nome||!ru||!'PDCA'.includes(ru))continue;
  const x={nome,r:ru,squadra:String(iS>=0?r[iS]:'').trim(),qt:iQt>=0?num(r[iQt]):null,fvm:iFvm>=0?num(r[iFvm]):null};
  if(tipo==='statistiche'){['pv','mv','fm','gf','gs','rp','ass','amm','esp','au'].forEach(k=>{x[k]=extra[k]>=0?num(r[extra[k]]):null});
   x.rc=iRc>=0?num(r[iRc]):null;x.rseg=iRp>=0?num(r[iRp]):null;x.rsb=iRm>=0?num(r[iRm]):null}
  list.push(x)}
 return list.length?{tipo,list}:null;
}
function uniscilistone(list,tipo){
 const key=x=>norm(x.nome)+'|'+norm(x.squadra);const old=new Map(S.listone.map(x=>[key(x),x]));
 if(tipo==='quotazioni'||!S.listone.length){
  // le quotazioni comandano su ruoli e giocatori presenti; le statistiche già caricate si conservano
  list.forEach(x=>{const o=old.get(key(x));if(o)for(const k in o)if(x[k]==null&&o[k]!=null)x[k]=o[k]});S.listone=list;
 }else{
  const nuovi=[];list.forEach(x=>{const o=old.get(key(x));if(o){for(const k in x)if(x[k]!=null&&!(k==='r'&&o.r))o[k]=x[k]}else nuovi.push(x)});S.listone=S.listone.concat(nuovi);
 }
 LMAP=null;MB.key=null;
}

   const sh=wb.SheetNames.find(n=>/fantacalcio/i.test(n))||wb.SheetNames[0];

   uniscilistone(L.list,L.tipo);S.listoneInfo=`${L.tipo==='quotazioni'?'quotazioni':'statistiche'} da ${file.name}, ${new Date().toLocaleDateString('it-IT')}`;
   S['info_'+L.tipo]=`${file.name}, ${new Date().toLocaleDateString('it-IT')}`;

 }
