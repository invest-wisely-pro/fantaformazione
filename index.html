<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantaformazione</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e7b47">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --bg:#e6ece7;--surface:#f6f9f6;--surface2:#edf2ee;--ink:#13201a;--muted:#55665c;--line:#c8d4cb;
  --pitch-a:#2e7b47;--pitch-b:#297141;--chalk:rgba(255,255,255,.5);
  --P:#e0960f;--D:#1f8f55;--C:#2a74c4;--A:#cf3c36;
  --ok:#1c9651;--warn:#d6970c;--bad:#cf3c36;
  --btn:#13201a;--btn-ink:#f6f9f6;--chipbg:#ffffff;--chipink:#13201a;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1510;--surface:#16201a;--surface2:#1c2821;--ink:#e4ede6;--muted:#93a499;--line:#2a3a30;
  --pitch-a:#1f5a34;--pitch-b:#1b522f;--chalk:rgba(255,255,255,.35);
  --P:#f0a92a;--D:#38b070;--C:#4b91de;--A:#e8574f;
  --ok:#37b26b;--warn:#e7ab2a;--bad:#e8574f;
  --btn:#e4ede6;--btn-ink:#0d1510;--chipbg:#f3f6f3;--chipink:#13201a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1510;--surface:#16201a;--surface2:#1c2821;--ink:#e4ede6;--muted:#93a499;--line:#2a3a30;
  --pitch-a:#1f5a34;--pitch-b:#1b522f;--chalk:rgba(255,255,255,.35);
  --P:#f0a92a;--D:#38b070;--C:#4b91de;--A:#e8574f;
  --ok:#37b26b;--warn:#e7ab2a;--bad:#e8574f;
  --btn:#e4ede6;--btn-ink:#0d1510;--chipbg:#f3f6f3;--chipink:#13201a;
  color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Segoe UI",system-ui,sans-serif;min-height:100%;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;letter-spacing:.01em}
h2{font-size:1.5rem;font-weight:700;margin:0 0 .5rem}
h3{font-size:1.15rem;font-weight:600;margin:1.25rem 0 .4rem}
p{margin:.3rem 0 .8rem}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--C);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:8px}
header.top h1{font-size:1.35rem;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .g{font-family:"Barlow Condensed",sans-serif;font-size:1.05rem;color:var(--muted);white-space:nowrap}
main{padding:16px 0 24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;text-decoration:none;color:var(--muted);font-size:.8rem;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{stroke:var(--ink)}

/* Scoreboard + pitch */
.board{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.board .mod{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:4.2rem;line-height:.85;letter-spacing:-.01em}
.board .meta{text-align:right;color:var(--muted);font-size:.92rem;line-height:1.3}
.board .meta b{display:block;color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;line-height:1}
.pitch{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:68/88;max-height:72vh;margin:0 auto;
  background:repeating-linear-gradient(180deg,var(--pitch-a) 0 9.09%,var(--pitch-b) 9.09% 18.18%)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.rows{position:absolute;inset:3% 2% 2%;display:flex;flex-direction:column;justify-content:space-around}
.row{display:flex;justify-content:space-evenly;align-items:flex-start}
.chip{background:none;border:0;padding:2px;display:flex;flex-direction:column;align-items:center;width:19%;min-width:0;cursor:pointer;color:#fff}
.disc{position:relative;width:46px;height:46px;border-radius:50%;background:var(--chipbg);color:var(--chipink);display:grid;place-items:center;border:4px solid var(--role);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.disc b{font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;font-weight:700}
.dot{position:absolute;right:-5px;top:-5px;width:15px;height:15px;border-radius:50%;border:2px solid #fff}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.chip .nm{margin-top:4px;font-weight:600;font-size:.82rem;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.chip .vs{font-size:.72rem;opacity:.9;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.r-P{--role:var(--P)}.r-D{--role:var(--D)}.r-C{--role:var(--C)}.r-A{--role:var(--A)}
.chip.lock .disc::after{content:"";position:absolute;left:-6px;bottom:-4px;width:13px;height:13px;border-radius:3px;background:var(--ink);border:2px solid #fff}

.mods{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.mods button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;text-align:left;cursor:pointer}
.mods button .m{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;line-height:1.1}
.mods button .s{font-size:.8rem;color:var(--muted)}
.mods button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.mods button[aria-pressed="true"] .s{color:inherit;opacity:.75}
.mods button:disabled{opacity:.45;cursor:default}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--btn);color:var(--btn-ink)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.small{padding:7px 12px;font-size:.92rem}
.btn.grow{flex:1}

.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list .n{width:1.6em;text-align:right;color:var(--muted);font-family:"Barlow Condensed",sans-serif;font-size:1.05rem}
.tag{flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem;background:var(--role)}
.who{flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.who .a{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .b{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx{flex:0 0 auto;min-width:38px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;border-radius:8px;padding:1px 6px;border:2px solid var(--line)}
.idx.ok{border-color:var(--ok)}.idx.warn{border-color:var(--warn)}.idx.bad{border-color:var(--bad)}.idx.off{color:var(--muted)}
select.st{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px;font-size:.88rem;max-width:122px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.auto{font-size:.72rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:1px}
details.guide{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);margin:10px 0}
details.guide summary{cursor:pointer;font-weight:600}
details.guide ol{padding-left:1.3em;margin:.6rem 0}
details.guide li{margin:.45rem 0}
.fresh{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.note{background:var(--surface2);border-left:4px solid var(--warn);border-radius:6px;padding:10px 12px;margin:10px 0;font-size:.94rem}
.empty{text-align:center;padding:32px 8px}
.empty .big{font-family:"Barlow Condensed",sans-serif;font-size:2.2rem;font-weight:700;line-height:1.05;margin-bottom:8px}

.field{display:block;margin:10px 0}
.field > span{display:block;font-size:.88rem;color:var(--muted);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px}
.field textarea{min-height:150px;font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.fx{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.fx .t{flex:1;font-weight:600;min-width:0}
.fx select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px;max-width:42%}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;cursor:pointer}
.stepper output{font-family:"Barlow Condensed",sans-serif;font-size:2rem;font-weight:700;min-width:2.2ch;text-align:center}
.votes input{width:64px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px;text-align:center}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface);font-family:"Barlow Condensed",sans-serif;font-size:1.1rem;font-weight:600}
.range{display:grid;grid-template-columns:8.5em 1fr 3em;align-items:center;gap:10px;margin:6px 0}
.range output{text-align:right;font-weight:600}
.tablewrap{overflow-x:auto}
table.teams{border-collapse:collapse;width:100%;font-size:.94rem}
table.teams th,table.teams td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.teams th{font-weight:600;color:var(--muted)}
table.teams input{width:56px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px;text-align:center}

dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:88vh;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,12,8,.55)}
.dlg{padding:18px 18px 16px;overflow-y:auto;max-height:88vh}
.dlg .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dlg .head h2{margin:0;flex:1;min-width:0}
.x{border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.bar{margin:12px 0}
.bar .l{display:flex;justify-content:space-between;font-weight:600}
.bar .track{height:8px;border-radius:4px;background:var(--surface2);margin:4px 0 3px;overflow:hidden}
.bar .fill{height:100%;background:var(--ink);border-radius:4px}
.bar .d{font-size:.86rem;color:var(--muted)}
.bigidx{font-family:"Barlow Condensed",sans-serif;font-size:3rem;font-weight:700;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (min-width:640px){.board .mod{font-size:5rem}.disc{width:54px;height:54px}.chip .nm{font-size:.9rem}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1 id="tName">Fantaformazione</h1><span class="g" id="tG"></span></div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabs" aria-label="Sezioni"><div class="wrap">
  <a href="#formazione" data-tab="formazione"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M4 12h16"/><circle cx="12" cy="12" r="2.6"/></svg>Formazione</a>
  <a href="#rosa" data-tab="rosa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.4 6-5.4s5.4 2 6 5.4"/><path d="M16 4.8a3.2 3.2 0 0 1 0 6.4M18 14.8c1.7.7 2.7 2.4 3 5.2"/></svg>Rosa</a>
  <a href="#giornata" data-tab="giornata"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Giornata</a>
  <a href="#lega" data-tab="lega"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="1.8" fill="var(--surface)"/><circle cx="15" cy="12" r="1.8" fill="var(--surface)"/><circle cx="8" cy="17" r="1.8" fill="var(--surface)"/></svg>Lega</a>
</div></nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileX" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="fileB" accept=".json,application/json" hidden>

<script>
/* ---------- Costanti ---------- */
const MODULI_ALL=['3-4-3','3-5-2','4-3-3','4-4-2','4-5-1','5-3-2','5-4-1'];
const RUOLI={P:'Portiere',D:'Difensore',C:'Centrocampista',A:'Attaccante'};
const ORD=['P','D','C','A'];
const STATI={tit:{l:'Titolare',s:100},bal:{l:'Ballottaggio',s:60},dub:{l:'In dubbio',s:35},pan:{l:'Panchina',s:15},inf:{l:'Infortunato',s:0,out:true},squ:{l:'Squalificato',s:0,out:true}};
const TEAMS0=[['Inter',21,9],['Lazio',14,4],['Roma',16,3],['Milan',14,7],['Como',12,7],['Frosinone',13,9],['Cagliari',6,7],['Juventus',9,8],['Napoli',10,7],['Torino',10,9],['Atalanta',10,11],['Lecce',9,12],['Sassuolo',12,14],['Monza',13,15],['Bologna',6,10],['Udinese',9,16],['Genoa',5,13],['Fiorentina',8,17],['Parma',4,13],['Venezia',6,16]];
const CAL={
 8:[['Torino','Monza'],['Cagliari','Bologna'],['Como','Sassuolo'],['Napoli','Roma'],['Lazio','Parma'],['Inter','Fiorentina'],['Genoa','Venezia'],['Atalanta','Frosinone'],['Lecce','Juventus'],['Udinese','Milan']],
 9:[['Sassuolo','Lazio'],['Roma','Cagliari'],['Torino','Como'],['Parma','Udinese'],['Milan','Bologna'],['Venezia','Inter'],['Monza','Napoli'],['Genoa','Juventus'],['Frosinone','Lecce'],['Fiorentina','Atalanta']]
};

/* ---------- Utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const uid=()=>Math.random().toString(36).slice(2,10);
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const abbr=t=>({Inter:'INT',Juventus:'JUV',Genoa:'GEN',Fiorentina:'FIO',Frosinone:'FRO',Monza:'MON',Milan:'MIL'}[t]||String(t||'').slice(0,3).toUpperCase());
const f2=n=>n==null?'–':n.toFixed(2).replace('.',',');
const f1=n=>n==null?'–':n.toFixed(1).replace('.',',');
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}

/* ---------- Archivio locale (IndexedDB) ---------- */
const DB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('fantaformazione',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
 get(k){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})},
 set(k,v){return new Promise(res=>{if(!this.db)return res(false);try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}
};
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{DB.set('state',JSON.parse(JSON.stringify(S)))},250)}

function fixturesFromCal(g){const m={};(CAL[g]||[]).forEach(([h,a])=>{m[h]={opp:a,casa:true};m[a]={opp:h,casa:false}});return m}
function defState(){return{v:1,
 settings:{nome:'La mia squadra',giornata:8,giornataAuto:true,moduli:[...MODULI_ALL],panchina:7,pesi:{d:40,r:35,m:25}},
 teams:TEAMS0.map(([n,gf,gs])=>({n,g:7,gf,gs})),teamsAgg:'19 ottobre 2026, dopo 7 giornate',
 players:[],fixtures:{},listone:[],listoneInfo:null,demo:false}}
let S=defState();
const ui={modulo:null};

/* ---------- Dati automatici (dati.json, aggiornato da GitHub) ---------- */
let DATI=null,GI=new Map();const FXC={};
function fmtData(iso){try{const d=new Date(iso);return d.toLocaleDateString('it-IT',{day:'numeric',month:'long'})+' alle '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}catch(e){return iso}}
async function loadDati(rete=true){
 if(!DATI){const c=await DB.get('dati');if(c&&c.squadre)DATI=c}
 let nuovo=false;
 if(rete&&location.protocol.startsWith('http')){try{const r=await fetch('dati.json',{cache:'no-cache'});if(r.ok){const d=await r.json();if(d&&Array.isArray(d.squadre)&&d.squadre.length){nuovo=!DATI||d.aggiornato!==DATI.aggiornato;DATI=d;DB.set('dati',d)}}}catch(e){}}
 applyDati();return nuovo;
}
function applyDati(){
 if(!DATI)return;GI=new Map((DATI.giocatori||[]).map(g=>[g.id,g]));Object.keys(FXC).forEach(k=>delete FXC[k]);
 if(DATI.squadre&&DATI.squadre.length){S.teams=DATI.squadre.map(t=>({n:t.n,g:t.g,gf:t.gf,gs:t.gs,xgf:t.xgf,xgs:t.xgs,pos:t.pos,pt:t.pt}));S.teamsAgg=DATI.aggiornato?'aggiornati in automatico il '+fmtData(DATI.aggiornato):'dati iniziali'}
 if(S.settings.giornataAuto!==false&&DATI.giornataCorrente)S.settings.giornata=DATI.giornataCorrente;
 autoLink();save();
}
function apiOf(p){return p.apiId!=null?GI.get(p.apiId):null}
function autoLink(){
 if(!GI.size)return;
 for(const p of S.players){if(p.apiId!=null&&GI.has(p.apiId))continue;const g=trovaApi(p.nome,p.squadra,p.ruolo);p.apiId=g?g.id:null}
}
function trovaApi(nome,squadra,ruolo){
 const n=norm(nome);if(!n)return null;const toks=n.split(' ');const last=toks[toks.length-1];
 const pool=[...GI.values()].filter(g=>!squadra||norm(g.s)===norm(squadra));
 const sc=g=>{const a=norm(g.n),c=norm(g.c);if(a===n||c===n)return 3;const ct=c.split(' ').concat(a.split(' '));if(toks.every(t=>ct.includes(t)))return 2;if(ct.includes(last)&&last.length>2)return 1;return 0};
 let best=[];let bs=0;for(const g of pool){const v=sc(g);if(v>bs){bs=v;best=[g]}else if(v===bs&&v>0)best.push(g)}
 if(best.length>1&&ruolo)best=best.filter(g=>g.r===ruolo);
 return bs>0&&best.length===1?best[0]:null;
}
function fxFromDati(g){if(FXC[g])return FXC[g];const m={};const L=DATI&&DATI.calendario&&DATI.calendario[g];if(!L)return null;L.forEach(([h,a])=>{m[h]={opp:a,casa:true};m[a]={opp:h,casa:false}});return FXC[g]=m}
function fxBase(g){return fxFromDati(g)||fixturesFromCal(g)}
function statoEff(p,g){
 if(p.statoG===g)return{s:p.stato,auto:false};
 const ind=p.apiId!=null&&DATI&&DATI.indisponibili&&DATI.indisponibili[p.apiId];
 if(ind&&g===DATI.giornataCorrente)return{s:ind.t,auto:true,m:ind.m};
 if(p.apiId!=null&&DATI)return{s:'tit',auto:true};
 return{s:p.stato||'tit',auto:false};
}
function histOf(p){
 const m=new Map();
 if(p.apiId!=null&&DATI&&DATI.voti){for(const [g,vs] of Object.entries(DATI.voti)){const v=vs[p.apiId];if(v)m.set(+g,{g:+g,fv:v[0],min:v[1],casa:v[2]==null?null:!!v[2],auto:true})}}
 (p.hist||[]).forEach(h=>m.set(h.g,h));return[...m.values()];
}

/* ---------- Algoritmo ---------- */
function teamStats(n){const t=S.teams.find(x=>norm(x.n)===norm(n));if(!t||!t.g)return null;const xg=t.xgf!=null&&t.xgs!=null;return{gf:t.gf/t.g,gs:t.gs/t.g,af:(xg?(t.gf+t.xgf)/2:t.gf)/t.g,as:(xg?(t.gs+t.xgs)/2:t.gs)/t.g,xg}}
function leagueAvg(){let g=0,gf=0;S.teams.forEach(t=>{g+=+t.g||0;gf+=t.xgf!=null?(+t.gf+ +t.xgf)/2:+t.gf||0});return g?gf/g:1.3}
function fixtureOf(p,g){const o=(S.fixtures[g]||{})[p.squadra];if(o&&o.opp)return o;return (fxBase(g)||{})[p.squadra]||null}

function disponibilita(p,g){
 const se=statoEff(p,g);const st=STATI[se.s]||STATI.tit;
 const last=histOf(p).filter(h=>h.min!=null).sort((a,b)=>b.g-a.g).slice(0,3);
 const am=last.length?avg(last.map(h=>Math.min(90,h.min))):null;
 const v=am==null?st.s:0.75*st.s+0.25*(am/90*100);
 const d=st.l+(se.auto&&se.m?` (${se.m})`:se.auto&&se.s!=='tit'?' (automatico)':'')+(am==null?', minuti non registrati':`, ${Math.round(am)}′ di media nelle ultime ${last.length}`);
 return{v:clamp(v),d,se};
}
function rendimento(p,fx){
 const voti=histOf(p).filter(h=>h.fv!=null).sort((a,b)=>b.g-a.g);
 const api=apiOf(p);const stimata=p.fm==null&&api&&api.fm!=null;
 const season=p.fm!=null?p.fm:stimata?api.fm:(voti.length?avg(voti.map(h=>h.fv)):null);
 const trend=voti.length>=2?avg(voti.slice(0,5).map(h=>h.fv)):null;
 let venue=null;
 if(fx){const vv=voti.filter(h=>h.casa===fx.casa);if(vv.length>=2)venue=avg(vv.map(h=>h.fv))}
 const parts=[[season,.5],[trend,.3],[venue,.2]].filter(x=>x[0]!=null);
 if(!parts.length)return{v:30,d:'Nessun voto: inserisci la fantamedia o i voti delle giornate',season,trend,hot:0};
 const w=parts.reduce((s,x)=>s+x[1],0);const base=parts.reduce((s,x)=>s+x[0]*x[1],0)/w;
 const hot=season!=null&&trend!=null?(trend-season>=.5?1:season-trend>=.5?-1:0):0;
 let d=`Fantamedia ${f2(season)}${stimata?' (stimata)':''}`;if(trend!=null)d+=`, ultime ${Math.min(5,voti.length)}: ${f2(trend)}`;if(venue!=null)d+=`, ${fx.casa?'in casa':'in trasferta'}: ${f2(venue)}`;
 return{v:clamp((base-5)/4*100),d,season,trend,hot,base};
}
function partita(p,fx){
 if(!fx||!fx.opp)return{v:50,d:'Avversario non impostato (sezione Giornata)'};
 const o=teamStats(fx.opp);if(!o)return{v:50,d:`Contro ${fx.opp}: statistiche squadra mancanti`};
 const a=leagueAvg();const atk=o.af/a,def=o.as/a;let v;
 if(p.ruolo==='P'||p.ruolo==='D')v=50-(atk-1)*45;
 else if(p.ruolo==='C')v=50+((def-1)-(atk-1))*25;
 else v=50+(def-1)*45;
 v+=fx.casa?7:-7;
 return{v:clamp(v),d:`${fx.casa?'In casa':'In trasferta'} contro ${fx.opp}: segna ${f1(o.gf)} e subisce ${f1(o.gs)} gol a partita${o.xg?`, con expected goals ${f1(o.af*2-o.gf)} e ${f1(o.as*2-o.gs)}`:''}`};
}
function score(p,g){
 const fx=fixtureOf(p,g);const w=S.settings.pesi;const tot=(w.d+w.r+w.m)||1;
 const D=disponibilita(p,g),R=rendimento(p,fx),M=partita(p,fx);const se=D.se;
 const idx=Math.round((w.d*D.v+w.r*R.v+w.m*M.v)/tot);
 const out=(STATI[se.s]||{}).out||p.forza==='out';
 let lvl=idx>=62?'ok':idx>=48?'warn':'bad';
 if(se.s==='bal'&&lvl==='ok')lvl='warn';
 if(se.s==='dub'||se.s==='pan')lvl='bad';
 return{p,D,R,M,idx,out,lvl,fx,st:se.s,auto:se.auto};
}
function calcola(){
 const g=S.settings.giornata;const sc=S.players.map(p=>score(p,g));
 const pool={P:[],D:[],C:[],A:[]};
 sc.filter(s=>!s.out).forEach(s=>pool[s.p.ruolo]&&pool[s.p.ruolo].push(s));
 const key=s=>s.idx+(s.p.forza==='in'?1000:0);
 ORD.forEach(r=>pool[r].sort((a,b)=>key(b)-key(a)));
 const mods=(S.settings.moduli.length?S.settings.moduli:MODULI_ALL);
 const ranking=mods.map(m=>{const [d,c,a]=m.split('-').map(Number);const need={P:1,D:d,C:c,A:a};
  const xi={};let sum=0,missing=[];
  ORD.forEach(r=>{xi[r]=pool[r].slice(0,need[r]);sum+=xi[r].reduce((s,x)=>s+x.idx,0);if(xi[r].length<need[r])missing.push(`${need[r]-xi[r].length} ${r}`)});
  const forced=ORD.reduce((n,r)=>n+pool[r].filter(s=>s.p.forza==='in').length-xi[r].filter(s=>s.p.forza==='in').length,0);
  return{modulo:m,xi,sum,ok:!missing.length,missing,forcedOut:forced}});
 const valid=ranking.filter(r=>r.ok);
 const pref=valid.filter(r=>!r.forcedOut);
 const best=(pref.length?pref:valid).slice().sort((a,b)=>b.sum-a.sum)[0]||null;
 ranking.sort((a,b)=>(b.ok-a.ok)||(b.sum-a.sum));
 return{sc,pool,ranking,best};
}
function panchina(res,form){
 const used=new Set(ORD.flatMap(r=>form.xi[r].map(s=>s.p.id)));
 const left={};ORD.forEach(r=>left[r]=res.pool[r].filter(s=>!used.has(s.p.id)));
 const n=S.settings.panchina;const out=[];
 if(left.P.length&&out.length<n)out.push(left.P.shift());
 let any=true;while(out.length<n&&any){any=false;for(const r of ['D','C','A']){if(out.length>=n)break;if(left[r].length){out.push(left[r].shift());any=true}}}
 if(out.length<n&&left.P.length)out.push(...left.P.splice(0,n-out.length));
 return out.sort((a,b)=>ORD.indexOf(a.p.ruolo)-ORD.indexOf(b.p.ruolo));
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(!el)return;const k=el.dataset.ch;
 if(k==='stato'){const p=S.players.find(x=>x.id===el.dataset.id);if(p){p.stato=el.value;p.statoG=S.settings.giornata;save();render();if(dlg.open)dlgInfo(p.id)}}
 else if(k==='opp'){const g=S.settings.giornata;S.fixtures[g]=S.fixtures[g]||{};const t=el.dataset.t;const prev=(S.fixtures[g][t]||(fxBase(g)||{})[t]||{}).opp;
  if(prev&&S.fixtures[g][prev]&&S.fixtures[g][prev].opp===t)delete S.fixtures[g][prev];
  const casa=(S.fixtures[g][t]||(fxBase(g)||{})[t]||{}).casa??true;
  if(el.value){S.fixtures[g][t]={opp:el.value,casa};S.fixtures[g][el.value]={opp:t,casa:!casa}}else delete S.fixtures[g][t];save();render()}
 else if(k==='nome'){S.settings.nome=el.value.trim()||'La mia squadra';save();render()}
 else if(k==='mod'){const m=el.value;const L=S.settings.moduli;if(el.checked){if(!L.includes(m))L.push(m)}else{if(L.length<=1){el.checked=true;toast('Serve almeno un modulo');return}S.settings.moduli=L.filter(x=>x!==m)}ui.modulo=null;save()}
 else if(k==='panchina'){S.settings.panchina=clamp(Math.round(num(el.value)||0),0,15);save();render()}
 else if(k==='team'){const t=S.teams[+el.dataset.i];t[el.dataset.k]=Math.max(0,Math.round(num(el.value)||0));S.teamsAgg='modificati da te';save()}
});

$('#fileX').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
 if(!window.XLSX){toast('Il lettore Excel non si è caricato: controlla la connessione e riprova');return}
 try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  const hi=rows.findIndex(r=>r.some(c=>norm(c)==='nome')&&r.some(c=>['r','ruolo'].includes(norm(c))));
  if(hi<0){toast('Non trovo le colonne Nome e R: usa il file Statistiche o Quotazioni di Fantacalcio.it');return}
  const H=rows[hi].map(c=>norm(c));const col=(...k)=>{for(const x of k){const i=H.indexOf(x);if(i>=0)return i}return -1};
  const iR=col('r','ruolo'),iN=col('nome'),iS=col('squadra'),iPv=col('pv'),iMv=col('mv'),iFm=col('fm');
  const list=[];for(const r of rows.slice(hi+1)){const nome=String(r[iN]??'').trim();const ru=String(r[iR]??'').trim().toUpperCase().charAt(0);
   if(!nome||!ru||!'PDCA'.includes(ru))continue;list.push({nome,r:ru,squadra:String(iS>=0?r[iS]:'').trim(),pv:iPv>=0?num(r[iPv]):null,mv:iMv>=0?num(r[iMv]):null,fm:iFm>=0?num(r[iFm]):null})}
  if(!list.length){toast('Il file non contiene giocatori riconoscibili');return}
  S.listone=list;S.listoneInfo=`${file.name}, caricato il ${new Date().toLocaleDateString('it-IT')}`;
  let upd=0;S.players.forEach(p=>{if(applyListoneTo(p))upd++});save();render();toast(`${list.length} giocatori letti, ${upd} della tua rosa aggiornati`)}
 catch(err){toast('Non riesco a leggere il file: è un Excel di Fantacalcio.it?')}});
