name: Aggiorna dati Serie A
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aggiorna-dati
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scarica i dati della Serie A
        run: python tools/aggiorna_dati.py dati.json
      - name: Pubblica se è cambiato
        run: |
          git config user.name "aggiorna-dati"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- dati.json; then echo "Nessuna novità"; exit 0; fi
          git add dati.json
          git commit -m "Dati Serie A aggiornati al $(date +%Y-%m-%d)"
          git push
